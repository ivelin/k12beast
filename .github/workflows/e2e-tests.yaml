# .github/workflows/e2e-tests.yaml
# File path: .github/workflows/e2e-tests.yaml
# Runs CI for K12Beast, including E2E and server tests with build debugging

name: Tests
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL_NAME: ${{ secrets.XAI_MODEL_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Check whether the Supabase host resolves
        id: supabase
        run: |
          node <<'NODE'
          const dns = require("dns").promises;
          const fs = require("fs");

          (async () => {
            const raw = process.env.NEXT_PUBLIC_SUPABASE_URL || "";
            let reachable = false;
            let detail = "NEXT_PUBLIC_SUPABASE_URL is empty";

            try {
              const host = new URL(raw).hostname;
              await dns.lookup(host);
              reachable = true;
              detail = `${host} resolves`;
            } catch (error) {
              const reason = error && (error.code || error.message) ? (error.code || error.message) : "unknown error";
              detail = `Supabase host is not reachable (${reason}). End-to-end tests need a live database and will be skipped.`;
            }

            console.log(detail);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `reachable=${reachable}\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Install Playwright browsers
        if: steps.supabase.outputs.reachable == 'true'
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        if: steps.supabase.outputs.reachable == 'true'
        run: npm run test:e2e
      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload E2E test screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  server-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL_NAME: ${{ secrets.XAI_MODEL_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Debug environment variables
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY: [REDACTED]"
          echo "SUPABASE_SERVICE_ROLE_KEY: [REDACTED]"
          echo "XAI_API_KEY: [REDACTED]"
          echo "XAI_MODEL_NAME: [REDACTED]"
          env | grep -E 'NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|XAI_API_KEY|XAI_MODEL_NAME'
      - name: Run build
        run: npm run build --verbose
      - name: Verify build manifest
        run: |
          if [ -f .next/build-manifest.json ]; then
            echo "build-manifest.json found"
          else
            echo "build-manifest.json missing"
            ls -la .next
            exit 1
          fi
      - name: Run Jest server tests
        run: npm run test:server
      - name: Upload server test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report
          path: test-results/
          retention-days: 7